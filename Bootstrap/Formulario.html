<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Centrado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        
        <section class="text-center mb-4">
            <h1 class="text-primary fw-bold">Bienvenido al formulario</h1>
            <p class="lead"> Ingrese su información en las siguientes campos:</p> <br>
            <p> Procure que la informació mnvc| n sea correcta.</p>
        </section>

        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                
                <div class="card shadow-sm p-4 mb-5 bg-white rounded">
                    
                    <form class="row g-3">
                        <div class="col-md-4">
                            <label for="validationDefault01" class="form-label">Nombres</label>
                            <input type="text" class="form-control" id="validationDefault01" value="" required>
                        </div>
                        
                        <div class="col-md-4">
                            <label for="validationDefault02" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="validationDefault02" value="" required>
                        </div>
                        
                        <div class="col-md-4">
                            <label for="validationDefaultUsername" class="form-label">Coreo elec.</label>
                            <div class="input-group">
                                <span class="input-group-text" id="inputGroupPrepend2">@</span>
                                <input type="text" class="form-control" id="validationDefaultUsername" aria-describedby="inputGroupPrepend2" required>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <label for="validationDefault03" class="form-label">Ubicación</label>
                            <input type="text" class="form-control" id="validationDefault03" required>
                        </div>
                        
                        <div class="col-md-3">
                            <label for="validationCustom04" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="validationCustom04" required>
                        </div>
                        
                        <div class="col-md-3">
                      <label for="validationDefault05" class="form-label">Contraseña</label>
             <input type="password" class="form-control" id="validationDefault05" required>
                </div>

                 <div class="col-12 text-end mt-4">
                <button class="btn btn-primary" type="submit">Enviar Formulario</button>
             </div>
       </form>
        </div>     
        </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
